<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="xfactoryx Roulette"><meta name="theme-color" content="#09080b"><title>Roulette · xfactoryx</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="roulette.css"></head><body><main><div class="game-layout">
<section class="wheel-card"><div class="wheel-stage"><a class="floating-brand" href="../../"><span>x</span>factory<span>x</span></a><div class="room-presence" id="roomPresence">MAIN · DEMO</div><canvas id="roulette" width="900" height="900" aria-label="룰렛 휠"></canvas><div class="table-status round-clock" id="roundClock"><div class="round-payout" id="roundPayout"></div><div class="status-main"><small id="statusRound">DEMO</small><strong id="statusHeadline">READY</strong><b id="roundTimer">—</b></div><div class="status-sub"><span id="betMessage" role="status">칩을 올려주세요.</span><div class="mode-banner demo" id="modeBanner"><b>DEMO</b><span>LOCAL</span></div></div><i id="roundProgress"></i></div></div></section>
<section class="quick-bar" aria-label="최근 결과와 포인트"><div class="history" id="history"><i class="green">0</i><i class="red">32</i><i>15</i><i class="red">19</i><i>4</i><i class="red">21</i></div><div class="wallet-card"><span class="coin">X</span><b id="walletBalance">10,000</b></div></section>
<section class="bet-panel"><section class="bet-card"><div class="casino-table" id="betOptions" aria-label="유러피안 룰렛 베팅판"><button class="zero green" data-bet="number" data-value="0">0</button><div class="number-grid" id="numberGrid"></div><div class="column-bets"><button data-bet="column" data-value="3">2:1</button><button data-bet="column" data-value="2">2:1</button><button data-bet="column" data-value="1">2:1</button></div><div class="dozen-bets"><button data-bet="dozen" data-value="1">1st 12</button><button data-bet="dozen" data-value="2">2nd 12</button><button data-bet="dozen" data-value="3">3rd 12</button></div><div class="outside-bets"><button data-bet="low">1–18</button><button data-bet="even">EVEN</button><button data-bet="red"><i class="diamond red"></i></button><button data-bet="black"><i class="diamond black"></i></button><button data-bet="odd">ODD</button><button data-bet="high">19–36</button></div></div>
<div class="bet-controls"><div class="amount-options" id="amountOptions"><button data-amount="1">1</button><button data-amount="2">2</button><button data-amount="5" class="active">5</button><button data-amount="10">10</button><button data-amount="20">20</button></div><button id="undoBet" class="clear-bet" aria-label="마지막 칩 되돌리기">↺</button><button id="clearBet" class="clear-bet" aria-label="모든 칩 지우기">×</button></div><button class="spin-button" id="spinButton"><span>▶</span><b>SPIN</b><small id="spinHint">LOCAL</small></button></section></section>
</div><div class="runtime-meta" aria-hidden="true"><span id="connectionDot"></span><span id="connectionLabel"></span><span id="userLabel"></span><span id="walletLabel"></span><span id="roundId">DEMO</span><span id="roundStatus"></span><span id="seed"></span><span id="wheelSpeed"></span><span id="ballSpeed"></span><span id="betAmountLabel">5</span><span id="roundPhase"></span><span id="resultPill"></span></div></main><script type="module" src="roulette-game.js?v=wood-themes-8"></script></body></html>
